[package]
name = "avanalyze"
version = "0.6.0"
edition = "2024"
repository = "https://github.com/findit-studio/avanalyze"
homepage = "https://github.com/findit-studio/avanalyze"
documentation = "https://docs.rs/avanalyze"
description = "Apple Vision.framework keyframe analysis that builds detections into an output vocabulary you name."
license = "MIT OR Apache-2.0"
rust-version = "1.95"
# The native half `build.rs` compiles on Apple targets — the
# `simd_float4x4` shim and the exception barrier beside it — declared so
# Cargo enforces a single owner of it per dependency graph. One key
# names both archives because Cargo takes one per package; what it has
# to be is unique, and the value carries the crate's major.minor,
# matching the symbol names inside them, so two semver-incompatible
# avanalyze versions can still coexist — exactly as
# `objc2-exception-helper`, already in this graph, scopes
# `objc2_exception_helper_0_1`. `build.rs` refuses to build if its
# `SHIM_ABI_TAG` and the `version` above ever disagree.
links = "avanalyze_0_6_objc_simd_shim"

[[bench]]
path = "benches/foo.rs"
name = "foo"
harness = false

[features]
default = ["serde?/default"]
serde = ["dep:serde"]
tracing = ["dep:tracing"]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }
smol_str = "0.3"

tracing = { version = "0.1", optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
# `exception` pulls in `objc2-exception-helper`, enabling
# `objc2::exception::catch` — the ONLY way to catch an Objective-C
# `NSException` unwinding across the Vision FFI boundary. Rust's
# `catch_unwind` cannot catch foreign exceptions, so without this a
# Vision detector that raises (e.g. on a pathological keyframe) aborts
# the whole process (`fatal runtime error: Rust cannot catch foreign
# exceptions`). See `VisionRequests::perform` / the `extract_*` guards.
objc2 = { version = "0.6", features = ["exception"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
# The pixel door's road into Vision. `performRequests:onCGImage:` is the
# only entry face that takes packed 24-bit RGB — the shape a decoder
# already holds — at an arbitrary row stride and without a re-encode;
# `CVPixelBufferCreateWithBytes` refuses several of those layouts
# outright (24BGR, 32RGBA) and reorders Vision's results for the rest.
# `CGImage` builds the image, `CGDataProvider` carries the `CFData` that
# owns the pixel copy, and `CGColorSpace` names the device RGB / gray
# space each format is read in. See `ffi::cg_image_from_plane`.
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGDataProvider", "CGColorSpace"] }
# `NSEnumerator` is what makes the bounded pose-dictionary reader
# possible: it gates `NSDictionary::keys()`, the safe, retaining,
# iterator-shaped read that `ffi::collect_dictionary_pairs` uses in place
# of `NSDictionary::to_vecs()` — whose safe surface hides an unbounded
# `getObjects:andKeys:` followed by `set_len` on an FFI-reported count.
# `NSDictionary` is named explicitly rather than left to arrive through
# objc2-vision's feature unification, because this crate now reads a
# dictionary in its own right.
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSData", "NSError", "NSObjCRuntime", "NSIndexSet", "NSUUID", "NSDictionary", "NSEnumerator"] }
objc2-core-video = { version = "0.3", features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-vision = { version = "0.3", features = [
  "objc2-core-foundation",
  "objc2-core-video",
  "alloc",
  "VNRequest", "VNRequestHandler", "VNObservation",
  "VNStatefulRequest",
  "VNClassifyImageRequest",
  "VNDetectFaceRectanglesRequest",
  "VNDetectFaceLandmarksRequest",
  "VNFaceLandmarks",
  "VNFaceObservationAccepting",
  "VNDetectFaceCaptureQualityRequest",
  "VNDetectHumanRectanglesRequest",
  "VNRecognizeAnimalsRequest",
  "VNDetectAnimalBodyPoseRequest",
  "VNDetectHumanBodyPoseRequest",
  "VNDetectHumanBodyPose3DRequest",
  "VNDetectHumanHandPoseRequest",
  "VNGeneratePersonInstanceMaskRequest",
  "VNGeneratePersonSegmentationRequest",
  "VNGeometry", "VNRecognizedPoint3D", "VNHumanBodyRecognizedPoint3D",
  "VNDetectedPoint", "VNTypes",
  "VNGenerateAttentionBasedSaliencyImageRequest",
  "VNGenerateObjectnessBasedSaliencyImageRequest",
  "VNRecognizeTextRequest",
  "VNDetectBarcodesRequest",
  "VNCalculateImageAestheticsScoresRequest",
  "VNDetectHorizonRequest",
  "VNDetectDocumentSegmentationRequest",
] }

[lints]
workspace = true

# Compiles `src/objc_simd_shim.m` — and, beside it, the deterministic
# test object in `src/objc_simd_shim_test.m` — on Apple targets only;
# see `build.rs`. Rust cannot receive Apple's `simd_float4x4` return
# type, so the one message send that needs it is emitted by Clang
# instead. Every other target builds the stubs and needs no C toolchain.
[build-dependencies]
cc = "1"

[dev-dependencies]
bytes = "1"
criterion = "0.8"
serde_json = "1"
tempfile = "3"

# The reference implementation of the `Detections` contract lives in
# `src/tests/reference.rs`: it wires mediaschema's validated domain
# aggregates to this crate's traits, so the conformance suite runs
# against a real, foreign, validating vocabulary instead of a
# permissive stub. Nothing in the engine or the public API links these
# — the dev graph is free to move independently.
# Follows mediaschema, not the newest release: the reference implementation
# hands mediaframe types (the `Dimensions` family) to mediaschema's
# constructors, so the two must link the SAME mediaframe — 0.2 pins 0.1.
mediaframe = { version = "0.1", default-features = false, features = ["std"] }
mediaschema = { version = "0.2", default-features = false, features = ["std", "video"] }

# Test-only Core Graphics surface, on top of what the engine itself
# links. The pixel door's format mappings are asserted by decoding a
# fixture through ImageIO and rendering each built `CGImage` back out
# into a bitmap context, channel by channel — which needs the drawing
# half of the framework the engine never calls. Kept out of
# `[dependencies]` so a consumer's build does not pull it.
[target.'cfg(target_vendor = "apple")'.dev-dependencies]
objc2-core-graphics = { version = "0.3", features = ["CGContext", "CGBitmapContext", "CGGeometry"] }

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
default-target = "aarch64-apple-darwin"
targets = []

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
] }
